name: Native verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: fedora / x64
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 25
    steps:
      - name: Install native verification tools
        run: >-
          dnf install -y git clang clang-tools-extra cmake ninja-build glslc pkgconf-pkg-config
          SDL3-devel SDL3_ttf-devel harfbuzz-devel SDL3_image-devel libpng-devel libwebp-devel libjpeg-turbo
          libX11-devel mesa-vulkan-drivers xorg-x11-server-Xvfb xorg-x11-xauth which
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure with Clang and Ninja
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Format
        run: clang-format --dry-run --Werror $(find include src tests -name '*.hpp' -o -name '*.cpp')
      - name: Tidy
        run: clang-tidy -p build/ci --quiet $(find src tests -name '*.cpp')
      - name: Test on lavapipe
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: xvfb-run -a ctest --test-dir build/ci --output-on-failure

  macos:
    name: macos / arm64
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Install native verification tools
        run: brew install llvm ninja pkgconf shaderc sdl3 sdl3_ttf sdl3_image harfbuzz libpng webp
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the pinned SDL_shadercross
        run: cmake -DPREFIX="$RUNNER_TEMP/shadercross" -P cmake/ProvisionShadercross.cmake
      # Homebrew's Clang: Xcode 16's libc++ still keeps std::jthread behind -fexperimental-library.
      - name: Configure with Clang and Ninja
        run: >-
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER="$(brew --prefix llvm)/bin/clang++"
          -DGPU2D_SHADERCROSS="$RUNNER_TEMP/shadercross/bin/shadercross"
      - name: Build
        run: cmake --build build/ci --parallel 3
      - name: Compile the MSL with Apple's Metal compiler
        run: |
          for msl in build/ci/shaders/*.msl; do
            xcrun -sdk macosx metal -Werror -c "$msl" -o "${msl%.msl}.air"
          done
      - name: Test without a GPU
        run: ctest --test-dir build/ci --output-on-failure -LE gpu
      - name: Test on the runner's Metal device
        run: ctest --test-dir build/ci --output-on-failure -L gpu
